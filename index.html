<!DOCTYPE html>
<html lang="en">
    <head>

        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="warning">
        <h1>Mini App only works for mobile devices</h1>

        <a href="https://t.me/trollcoin_test_bot">Open Telegram Mini-App</a>

    <div class="content">
        <div id="tasks" class="tasks">
            <!-- <div>
                <img src="https://i.gifer.com/5Mz4.gif" width="150" alt="Fire gif">
                <h1>This page is under development. Dev is cooking...</h1>
            </div> -->
    
            <div class="taskBox">
                <h2>Daily tasks</h2>
    
                <div class="task">
                    <p>Daily check-in</p>
    
                    <button class="followBtn" id="claim">Claim</button>
                </div>
                <!-- <h2>Follow channels</h2>
    
                <div class="task">
                    <p>Follow to channel</p>
    
                    <button class="followBtn" id="followBtn">Follow</button>
                </div>
                <div class="task">
                    <p>Follow to channel</p>
    
                    <button class="followBtn" id="followBtn">Follow</button>
                </div> -->
    
                <h2>Invite others</h2>
                <div class="task">
                    <p>Invite your friends</p>
    
                    <span>
                        <button id="refBtn">Share</button>
                    </span>
                </div>
    
                <h2>TON transaction</h2>
                <div class="task">
                    <p>Send 0.05 TON (and earn +1mln coins)</p>
    
                    <button id="sendTonBtn">Complete</button>
                </div>
            </div>
        </div>
    
        <div class="main" id="main">
            <div class="top">
                <div>
                    <p id="level">Level</p>
                </div>
    
                <div class="settingBtn" id="settingBtn">
                    <p><i class="fas fa-cog"></i></p>
                </div>
            </div>
            
            <h1 id="h1">0</h1>
    
            <div class="coin" id="coin">
                 <!-- <p style="color: grey;">Tap or just hold</p> -->
            </div>
    
            <div class="xtap">
                <!-- <div>
                    <p>100/100</p>
                </div>
                <div class="guru" id="guru">
                    <p><i class="fa-solid fa-fire"></i></p>
                </div> -->
                
            </div>
    
            <!-- <div class="guruBox"></div> -->
    
        </div>
        <div class="setting" id="setting">
            <div class="sinfo">
                <img src="https://i.gifer.com/5Mz4.gif" width="150" alt="Fire gif">
                <h1>This page is under development. Dev is cooking...</h1>
            </div>
        </div>
        <div class="refBox" id="refBox">
            <h1>This feature is not ready yet</h1>
            <button id="okref">OK</button>
        </div>
        
        <div class="profile" id="profile">
            <div class="walletBox">
                <h1>CONNECT TON WALLET</h1>
    
                <div id="ton-connect"></div>
            </div>
            <br>
            <div class="infoBox">
                <h1 id="balance"></h1>
            </div>
        </div>
    
        <div class="menu">
            <div id="tasks-btn" class="tasks-btn">
                <p><i class="fa-solid fa-list-check"></i></p>
            </div>
            <div id="main-btn" class="main-btn">
                <p><i class="fa-solid fa-house"></i></p>
            </div>
            <div id="profile-btn" class="profile-btn">
                <p><i class="fa-solid fa-user"></i></p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const user = tg.initDataUnsafe.user;
        const token = '7810844270:AAFSpHIvkn6biL0hcbaDJaiOP-F25eEWoSQ'

        document.getElementById('main-btn').classList.add('one')
        
        document.getElementById('profile-btn').addEventListener('click', ()=>{
            document.getElementById('tasks').style.display = 'none'
            document.getElementById('main').style.display = 'none'
            document.getElementById('profile').style.display = 'block'
            
            document.getElementById('profile-btn').classList.add('active');
            document.getElementById('main-btn').classList.remove('active');
            document.getElementById('main-btn').classList.remove('one')
            document.getElementById('tasks-btn').classList.remove('active');
        })
        
        document.getElementById('main-btn').addEventListener('click', ()=>{
            document.getElementById('tasks').style.display = 'none'
            document.getElementById('main').style.display = 'block'
            document.getElementById('profile').style.display = 'none'
            
            document.getElementById('main-btn').classList.add('active');
            document.getElementById('profile-btn').classList.remove('active');
            document.getElementById('tasks-btn').classList.remove('active');
        })
        
        document.getElementById('tasks-btn').addEventListener('click', ()=>{
            document.getElementById('tasks').style.display = 'block'
            document.getElementById('main').style.display = 'none'
            document.getElementById('profile').style.display = 'none'
            
            document.getElementById('tasks-btn').classList.add('active');
            document.getElementById('profile-btn').classList.remove('active');
            document.getElementById('main-btn').classList.remove('active');
            document.getElementById('main-btn').classList.remove('one')
        })

        let coins = Number(localStorage.getItem('coins'))
        let h1 = document.getElementById('h1')
        let count = 0
        count = Math.floor(coins * 0.8)
        
        if(!coins) {
            localStorage.setItem('coins', 0)
            document.getElementById('h1').innerText = 0
        } else {
            h1.textContent = (coins).toLocaleString('en-US')
        }

        async function coinClick() {
            coins++
            
            localStorage.setItem('coins', coins)

            h1.textContent = (coins).toLocaleString('en-US')

            //effects
            const coinBox = document.getElementById('coin')
            const coinEffect = document.createElement('div')
            coinEffect.classList.add('coinEffect')
            coinEffect.textContent = '+1'

            const rect = coinBox.getBoundingClientRect()
            const x = event.clientX - rect.left
            const y = event.clientY - rect.top

            coinEffect.style.top = `${y}px`
            coinEffect.style.left = `${x}px`
            
            coinBox.appendChild(coinEffect)
        
            setTimeout(()=>{
                coinEffect.remove()
            }, 2000)
        }

        document.getElementById('coin').addEventListener("click", coinClick)
        // document.getElementById('coin').addEventListener("touchstart", (e)=>{
        //     e.preventDefault();
        //     const numbOfFingers = e.touches.length;
        //     console.log(numbOfFingers);
            
        // })

        let interval = null

        function startCount(){
            
            setTimeout(()=>{
                h1.classList.add('active')
                // document.getElementById('trollface').classList.add('active')
                document.getElementById('coin').classList.add('active')
                navigator.vibrate(500)
    
                interval = setInterval(()=>{
                    count++
                    h1.textContent = count
                    localStorage.setItem('coins', count)        
            }, 100)
            }, 2000)
        }

        // document.getElementById('coin').addEventListener("touchstart", startCount)

        function stop(){
            clearInterval(interval)
            h1.classList.remove('active')
            // document.getElementById('trollface').classList.remove('active')
            document.getElementById('coin').classList.remove('active')
        }

        // document.getElementById('coin').addEventListener("touchend", stop)
        // document.getElementById('coin').addEventListener("touchcancel", stop)
        // document.getElementById('coin').addEventListener("touchmove", stop)
        // document.getElementById('coin').addEventListener("mouseover", stop)

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://utopialf.github.io/trollcoin/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        tonConnectUI.uiOptions = {
            twaReturnUrl: 'https://t.me/trollcoin_test_bot'
        };

        // const walletAddress = tonConnect.account?.address;
        // if(walletAddress){
        //     document.getElementById('balance').textContent = 
        // }

        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 60, // expires in 60 sec
            messages: [
                {
                address: "UQDTtBHATFoDgXj1ZG0iQtf7M9kuAxcGlVmUIzowq1Goz8PD", // Replace with your real wallet
                amount: "50000000"
                },
            ],
        };

        async function sendTon() {
            try{
                const result = await tonConnectUI.sendTransaction(transaction);
                Telegram.WebApp.showPopup({
                    title: 'Success',
                    message: 'Transaction sent!',
                    buttons: [
                        {id: 'ok', type: 'ok', text: 'Done'}
                    ]
                })
                localStorage.setItem('sendTon', 'completed')
                document.getElementById('sendTonBtn').style.background = '#0098EA'
                document.getElementById('sendTonBtn').style.color = 'white'
                document.getElementById('sendTonBtn').textContent = 'Completed'

                coins += 1000000;
                localStorage.setItem('coins', coins)
                h1.textContent = coins
            } catch(error){
                Telegram.WebApp.showPopup({
                    title: 'Error',
                    message: 'Transaction failed',
                    buttons: [
                        {id: 'ok', type: 'ok', text: 'OK'}
                    ]
                })
            }
        }

        if(localStorage.getItem('sendTon') === 'completed'){
            document.getElementById('sendTonBtn').style.background = '#0098EA'
            document.getElementById('sendTonBtn').style.color = 'white'
            document.getElementById('sendTonBtn').textContent = 'Completed'
            document.getElementById('sendTonBtn').disabled = true;
        }

        document.getElementById('sendTonBtn').addEventListener('click', sendTon)

        // const channels = ['@durov', '@notcoin'];

        let followBtn = document.getElementsByClassName('followBtn');

        for (let i = 0; i < followBtn.length; i++) {
            followBtn[i].addEventListener('click', ()=>{
                window.location.href = channels[i]
            })
        }

        document.getElementById('claim').addEventListener('click', ()=>{
            const today = new Date();
            const day = today.getDate();
            const month = today.getMonth();
            const year = today.getFullYear();
            let dailyCheckIn = localStorage.getItem(`${day}-${month}-${year}`) || 0;

            if(dailyCheckIn == 0) {
                coins += 5000;
                localStorage.setItem('coins', coins);
                localStorage.setItem(`${day}-${month}-${year}`, 'yes');
                h1.textContent = coins.toLocaleString('en-US');

                document.getElementById('claim').style.background = '#0098EA'
                document.getElementById('claim').style.color = 'white'
                document.getElementById('claim').textContent = 'Completed'
                document.getElementById('claim').disabled = true;

                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${user.id}&text=You’ve received 5k coins! Enjoy your rewards!`)
                .then(response => response.json())
                .then(data => console.log('Message sent successfully'))
                .catch(err => console.error("Some error" + err))
            } else {
                Telegram.WebApp.showPopup({
                    title: 'Error',
                    message: 'You have already claimed your reward. Come back tomorrow!',
                    buttons: [
                        {id: 'ok', type: 'ok', text: 'OK'}
                    ]
                })
            }
        })

        // const today = new Date();
        // const day = today.getDate();
        // const month = today.getMonth();
        // const year = today.getFullYear();

        // localStorage.setItem(`${day}-${month}-${year}`, 'no');
        // if(localStorage.getItem(`${day}-${month}-${year}`) == '')

        if(coins < 100){
            document.getElementById('level').textContent = 'Level: Brokie'
        } else if(coins > 100 && coins < 500){
            document.getElementById('level').textContent = 'Level: Newbie'
        } else if(coins > 500 && coins < 1000){
            document.getElementById('level').textContent = 'Level: Player'
        } else if(coins > 1000 && coins < 10000){
            document.getElementById('level').textContent = 'Level: Master'
        } else if(coins > 10000){
            document.getElementById('level').textContent = 'Level: King'
        }

        document.getElementById('settingBtn').addEventListener('click', ()=>{
            document.getElementById('setting').classList.toggle('active')
        })
        document.getElementById('refBtn').addEventListener('click', ()=>{
            document.getElementById('refBox').classList.add('active')
        })
        document.getElementById('okref').addEventListener('click', ()=>{
            document.getElementById('refBox').classList.remove('active')
        })
    </script>
</body>
</html>
